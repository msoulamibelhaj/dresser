name: Build and Test Maestro iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test Maestro
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Default Scheme
        run: |
          cd WardrobeXcodeProject
          echo "Listing schemes..."
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default > default
          echo "Using default scheme: $default"

      - name: Build
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          cd WardrobeXcodeProject
          # Find first available iPhone simulator
          device=`xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//"`
          if [ $scheme = default ]; then scheme=$(cat default); fi
          echo "Building scheme $scheme for device $device"
          xcodebuild build-for-testing -scheme "$scheme" -project "WardrobeXcodeProject.xcodeproj" -destination "platform=$platform,name=$device"

      - name: Test
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: |
          cd WardrobeXcodeProject
          # Find first available iPhone simulator
          device=`xcrun xctrace list devices 2>&1 | grep -oE 'iPhone.*?[^\(]+' | head -1 | awk '{$1=$1;print}' | sed -e "s/ Simulator$//"`
          if [ $scheme = default ]; then scheme=$(cat default); fi
          echo "Testing scheme $scheme on device $device"
          xcodebuild test-without-building -scheme "$scheme" -project "WardrobeXcodeProject.xcodeproj" -destination "platform=$platform,name=$device"
